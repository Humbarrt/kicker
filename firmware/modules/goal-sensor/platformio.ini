; Goal sensor module: two IR break-beam sensors in the tubes below the goals (spec 01, goal_sensor@1).
; Reference board: Waveshare RP2040-Zero (D13), Arduino core by Earle Philhower.

[platformio]
default_envs = rp2040-zero

[env]
framework = arduino
lib_deps =
    symlink://../../lib/KickerModule
    bblanchon/ArduinoJson@^7

[env:rp2040-zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
board_build.core = earlephilhower
monitor_speed = 115200
